name: Course readiness

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_ENABLED: 'false'
      CREWAI_TRACING_ENABLED: 'false'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/maintenance.txt
      - name: Install course and verification dependencies
        run: python -m pip install -r requirements/maintenance.txt
      - name: Run unit and integration readiness gates
        run: python tools/check_readiness.py
      - name: Preserve JUnit reports and executed notebook copies
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-${{ matrix.os }}
          path: .test-results/readiness/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
