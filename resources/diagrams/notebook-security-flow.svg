<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">03 · Repair two local controls</title><desc id="desc">The input gate rejects unsafe text before a mock lookup. The independent worker loop allows an initial attempt and three retries, then records escalation. Inspect call evidence and run the grader.</desc><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b44}.title{font-size:31px;font-weight:700}.sub{font-size:19px}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:18px}.card{fill:#f6f9fc;stroke:#61778f;stroke-width:2}.gate{fill:#fff8e8;stroke:#976000;stroke-width:2}.ok{fill:#edf9f2;stroke:#24734f;stroke-width:2}.stop{fill:#fff1ef;stroke:#a5362b;stroke-width:2}.arrow{fill:none;stroke:#365b80;stroke-width:3;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b80"/></marker></defs><rect width="1200" height="560" fill="white"/><text x="40" y="52" class="title">03 · Repair two local controls</text><text x="40" y="89" class="sub">Two separate paths: validate tool input and bound an always-failing worker.</text><rect x="40" y="145" width="340" height="156" rx="12" class="gate"/><text x="58" y="180" class="label">Input gate · EDIT</text><text x="58" y="217" class="body">SecureToolInput accepts</text><text x="58" y="245" class="body">numeric strings, 1–12 digits.</text><text x="58" y="273" class="body">Reject unsafe text first.</text><path d="M380 223H425" class="arrow"/><rect x="425" y="145" width="340" height="156" rx="12" class="card"/><text x="443" y="180" class="label">Valid input → mock lookup</text><text x="443" y="217" class="body">The tool appends to a list.</text><text x="443" y="245" class="body">It does not query a database.</text><text x="443" y="273" class="body">Invalid input makes no call.</text><path d="M765 223H810" class="arrow"/><rect x="810" y="145" width="350" height="156" rx="12" class="ok"/><text x="828" y="180" class="label">Inspect input evidence</text><text x="828" y="217" class="body">Compare unsafe and safe inputs.</text><text x="828" y="245" class="body">Read tool_call_log.</text><text x="828" y="273" class="body">Unsafe input stays blocked.</text><rect x="40" y="355" width="340" height="156" rx="12" class="gate"/><text x="58" y="390" class="label">Retry ceiling · EDIT</text><text x="58" y="427" class="body">Set MAX_RETRIES = 3.</text><text x="58" y="455" class="body">Worker always returns False.</text><text x="58" y="483" class="body">One initial attempt + 3 retries.</text><path d="M380 433H425" class="arrow"/><rect x="425" y="355" width="340" height="156" rx="12" class="card"/><text x="443" y="390" class="label">Bounded local loop</text><text x="443" y="427" class="body">Expect exactly four calls.</text><text x="443" y="455" class="body">Counter is teaching arithmetic.</text><text x="443" y="483" class="body">No API spending occurs.</text><path d="M765 433H810" class="arrow"/><rect x="810" y="355" width="350" height="156" rx="12" class="ok"/><text x="828" y="390" class="label">Stop → inspect → grade</text><text x="828" y="427" class="body">Record ESCALATE_TO_HUMAN.</text><text x="828" y="455" class="body">No human message is sent.</text><text x="828" y="483" class="body">Rerun dependent cells: 15/15.</text></svg>
