<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">00 · Check your local environment</title><desc id="desc">Run package, local execution mode, course root and temporary file checks. Required failures lead back to setup; passing all required checks leads to Lab 1. No code edits or agent execution.</desc><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b44}.title{font-size:31px;font-weight:700}.sub{font-size:19px}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:18px}.card{fill:#f6f9fc;stroke:#61778f;stroke-width:2}.gate{fill:#fff8e8;stroke:#976000;stroke-width:2}.ok{fill:#edf9f2;stroke:#24734f;stroke-width:2}.stop{fill:#fff1ef;stroke:#a5362b;stroke-width:2}.arrow{fill:none;stroke:#365b80;stroke-width:3;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b80"/></marker></defs><rect width="1200" height="560" fill="white"/><text x="40" y="52" class="title">00 · Check your local environment</text><text x="40" y="89" class="sub">Interact with Python, installed packages, course paths, and a temporary file.</text><rect x="40" y="145" width="265" height="156" rx="12" class="card"/><text x="58" y="180" class="label">1 · Packages</text><text x="58" y="217" class="body">Import required packages.</text><text x="58" y="245" class="body">Read installed versions.</text><text x="58" y="273" class="body">Optional is advisory.</text><rect x="325" y="145" width="265" height="156" rx="12" class="card"/><text x="343" y="180" class="label">2 · Execution mode</text><text x="343" y="217" class="body">Inspect local-only flags.</text><text x="343" y="245" class="body">No agent team starts.</text><text x="343" y="273" class="body">No provider call runs.</text><rect x="610" y="145" width="265" height="156" rx="12" class="card"/><text x="628" y="180" class="label">3 · Course root</text><text x="628" y="217" class="body">Check required folders</text><text x="628" y="245" class="body">and course marker files.</text><text x="628" y="273" class="body">Use the course root.</text><rect x="895" y="145" width="265" height="156" rx="12" class="card"/><text x="913" y="180" class="label">4 · File access</text><text x="913" y="217" class="body">Write a temporary probe.</text><text x="913" y="245" class="body">Read it and delete it.</text><text x="913" y="273" class="body">Keep course files together.</text><path d="M305 223H325" class="arrow"/><path d="M590 223H610" class="arrow"/><path d="M875 223H895" class="arrow"/><rect x="40" y="355" width="550" height="140" rx="12" class="stop"/><text x="58" y="390" class="label">Required check failed?</text><text x="58" y="427" class="body">Open SETUP.md, fix the environment, then rerun.</text><text x="58" y="455" class="body">No learner code edits or graded TODOs.</text><rect x="610" y="355" width="550" height="140" rx="12" class="ok"/><text x="628" y="390" class="label">All required checks pass</text><text x="628" y="427" class="body">Open Lab 1 and repair its Pydantic contract.</text><text x="628" y="455" class="body">The temporary write probe has been removed.</text></svg>
