<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">06 · Prove that publication stops safely</title><desc id="desc">Three independent cases prove denied publication preserves the old file, a changed candidate invalidates approval, and missing input stops the CLI. Restart before repeating cells that create temporary directories. Edit then restore the QA-denial experiment.</desc><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b44}.title{font-size:31px;font-weight:700}.sub{font-size:19px}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:18px}.card{fill:#f6f9fc;stroke:#61778f;stroke-width:2}.gate{fill:#fff8e8;stroke:#976000;stroke-width:2}.ok{fill:#edf9f2;stroke:#24734f;stroke-width:2}.stop{fill:#fff1ef;stroke:#a5362b;stroke-width:2}.arrow{fill:none;stroke:#365b80;stroke-width:3;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b80"/></marker></defs><rect width="1200" height="580" fill="white"/><text x="40" y="52" class="title">06 · Prove that publication stops safely</text><text x="40" y="89" class="sub">Run real local checks and temporary-file experiments; inspect the assertions in each case.</text><rect x="40" y="145" width="350" height="175" rx="12" class="stop"/><text x="58" y="180" class="label">Case A · Denied publish</text><text x="58" y="217" class="body">Run the local orchestrator.</text><text x="58" y="245" class="body">Approval function rejects publish.</text><text x="58" y="273" class="body">Existing output stays unchanged.</text><rect x="425" y="145" width="350" height="175" rx="12" class="stop"/><text x="443" y="180" class="label">Case B · Stale evidence</text><text x="443" y="217" class="body">Mutate candidate at final approval.</text><text x="443" y="245" class="body">A True decision cannot repair</text><text x="443" y="273" class="body">the hash/revision mismatch.</text><rect x="810" y="145" width="350" height="175" rx="12" class="stop"/><text x="828" y="180" class="label">Case C · Missing input</text><text x="828" y="217" class="body">Run the CLI with --no-input.</text><text x="828" y="245" class="body">It exits at the approval gate.</text><text x="828" y="273" class="body">No output page is created.</text><rect x="40" y="370" width="550" height="160" rx="12" class="gate"/><text x="58" y="405" class="label">Your edit-and-restore experiment</text><text x="58" y="442" class="body">Restart kernel; deny qa instead of publish in Case A.</text><text x="58" y="470" class="body">Change its expected counter from 0.45 to 0.40.</text><text x="58" y="498" class="body">Restore both edits; restart and run all cells.</text><rect x="610" y="370" width="550" height="160" rx="12" class="ok"/><text x="628" y="405" class="label">Inspect release evidence</text><text x="628" y="442" class="body">Read status, hashes, exit code, and file assertions.</text><text x="628" y="470" class="body">All work uses local temporary paths and fixed outputs.</text><text x="628" y="498" class="body">No GitHub workflow or cloud deployment runs.</text></svg>
