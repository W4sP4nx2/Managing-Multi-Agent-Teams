<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1760" viewBox="0 0 1760 1760" role="img" aria-labelledby="erd-title erd-description">
<title id="erd-title">Capstone ERD: implemented local factory evidence and simulated costs</title>
<desc id="erd-description">Read from the run to its candidate artifact, reviews and QA, approval, and local publication receipt. The factory.sqlite evidence database has factory_runs as the parent of artifacts, stage_approvals, reviews, qa_cases, deployments, and factory_events through real foreign keys. Reviews, QA cases, and deployments also reference artifacts. Deployments reference stage approvals. These ten relationships each permit one parent to zero or many children. The separate simulated_costs.sqlite database contains simulated_cost_runs and simulated_cost_events. Their run_id association, and the run_id association across databases, are logical joins without SQLite foreign keys. A SQLite insert trigger checks matching approved publication, run, artifact SHA-256, and Git revision; application code also checks committed bytes and local target. Notebook approvals use a named fixture actor, while the terminal asks a person. The travel page is static HTML containing Kyoto, Lisbon, and Chiang Mai; no travel-domain tables exist.</desc>
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b44}.title{font-size:32px;font-weight:700}.subtitle{font-size:19px}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.panel-title{font-size:23px;font-weight:700}.table{fill:#fff;stroke:#334155;stroke-width:2}.header{fill:#e6edf5;stroke:#334155;stroke-width:2}.name{font-size:23px;font-weight:700}.field{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px}.note{font-size:17px}.legend{font-size:18px}.run{fill:none;stroke:#3878a5;stroke-width:3;marker-end:url(#blue-arrow)}.artifact{fill:none;stroke:#26745d;stroke-width:3;marker-end:url(#green-arrow)}.approval{fill:none;stroke:#a46808;stroke-width:3;marker-end:url(#gold-arrow)}.logical{fill:none;stroke:#7c6094;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#purple-arrow)}</style>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3878a5"/></marker>
<marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#26745d"/></marker>
<marker id="gold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a46808"/></marker>
<marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c6094"/></marker>
