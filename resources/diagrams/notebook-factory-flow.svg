<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">05 · Trace a real local release with fixed outputs</title><desc id="desc">Checked-in fixtures feed six scripted decisions. The orchestrator performs real local checks and Git work. Final approval permits a temporary HTML copy; denying publish stops the copy. Terminal use replaces fixture decisions with human prompts.</desc><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b44}.title{font-size:31px;font-weight:700}.sub{font-size:19px}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:18px}.card{fill:#f6f9fc;stroke:#61778f;stroke-width:2}.gate{fill:#fff8e8;stroke:#976000;stroke-width:2}.ok{fill:#edf9f2;stroke:#24734f;stroke-width:2}.stop{fill:#fff1ef;stroke:#a5362b;stroke-width:2}.arrow{fill:none;stroke:#365b80;stroke-width:3;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b80"/></marker></defs><rect width="1200" height="560" fill="white"/><text x="40" y="52" class="title">05 · Trace a real local release with fixed outputs</text><text x="40" y="89" class="sub">You interact with fixtures, the orchestrator, temporary files, Git, and evidence databases.</text><rect x="40" y="145" width="265" height="156" rx="12" class="card"/><text x="58" y="180" class="label">Checked-in fixtures</text><text x="58" y="217" class="body">Read HTML and reviews.</text><text x="58" y="245" class="body">Eight QA cases run locally.</text><text x="58" y="273" class="body">No model generates output.</text><rect x="325" y="145" width="265" height="156" rx="12" class="gate"/><text x="343" y="180" class="label">Six stage decisions</text><text x="343" y="217" class="body">plan → code → Security</text><text x="343" y="245" class="body">→ UI/UX → QA → publish</text><text x="343" y="273" class="body">Actor: notebook-fixture.</text><rect x="610" y="145" width="265" height="156" rx="12" class="card"/><text x="628" y="180" class="label">Temporary Git work</text><text x="628" y="217" class="body">Create a real worktree.</text><text x="628" y="245" class="body">Check and commit files.</text><text x="628" y="273" class="body">Record hash and revision.</text><rect x="895" y="145" width="265" height="156" rx="12" class="ok"/><text x="913" y="180" class="label">Final publication</text><text x="913" y="217" class="body">All gates pass: copy HTML.</text><text x="913" y="245" class="body">Publish denied: no copy.</text><text x="913" y="273" class="body">Local file, no hosted site.</text><path d="M305 223H325" class="arrow"/><path d="M590 223H610" class="arrow"/><path d="M875 223H895" class="arrow"/><rect x="40" y="355" width="550" height="160" rx="12" class="gate"/><text x="58" y="390" class="label">Your experiment</text><text x="58" y="427" class="body">Remove publish from scripted_approved_stages.</text><text x="58" y="455" class="body">Rerun the rehearsal cell, inspect denial, then restore.</text><text x="58" y="483" class="body">Notebook decisions are scripted test evidence.</text><rect x="610" y="355" width="550" height="160" rx="12" class="ok"/><text x="628" y="390" class="label">Evidence to inspect</text><text x="628" y="427" class="body">Candidate hash, commit, reviews, eight QA results, receipt.</text><text x="628" y="455" class="body">Default teaching total: $0.50; publish denied: $0.45.</text><text x="628" y="483" class="body">Actual API cost: $0.00. Terminal route asks you at each gate.</text></svg>
