<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">04 · Validate a team-to-team handoff</title><desc id="desc">A fixed request goes to Development, the Coordinator validates the DevDeliverable, and Security revalidates and scans local training markers. Repair the contract, Coordinator gate and Manager tool permission, then grade and write the ADR.</desc><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b44}.title{font-size:31px;font-weight:700}.sub{font-size:19px}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:18px}.card{fill:#f6f9fc;stroke:#61778f;stroke-width:2}.gate{fill:#fff8e8;stroke:#976000;stroke-width:2}.ok{fill:#edf9f2;stroke:#24734f;stroke-width:2}.stop{fill:#fff1ef;stroke:#a5362b;stroke-width:2}.arrow{fill:none;stroke:#365b80;stroke-width:3;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365b80"/></marker></defs><rect width="1200" height="560" fill="white"/><text x="40" y="52" class="title">04 · Validate a team-to-team handoff</text><text x="40" y="89" class="sub">Run deterministic Python adapters; inspect separately constructed CrewAI configurations.</text><rect x="40" y="145" width="265" height="156" rx="12" class="card"/><text x="58" y="180" class="label">Product Owner</text><text x="58" y="217" class="body">Read the fixed request.</text><text x="58" y="245" class="body">A login API is the scenario;</text><text x="58" y="273" class="body">no service is deployed.</text><rect x="325" y="145" width="265" height="156" rx="12" class="gate"/><text x="343" y="180" class="label">Development adapter</text><text x="343" y="217" class="body">Creates a fixed deliverable.</text><text x="343" y="245" class="body">EDIT DevDeliverable to</text><text x="343" y="273" class="body">reject failed unit-test status.</text><rect x="610" y="145" width="265" height="156" rx="12" class="gate"/><text x="628" y="180" class="label">Coordinator · EDIT</text><text x="628" y="217" class="body">Validate before handoff.</text><text x="628" y="245" class="body">Invalid payload → stop.</text><text x="628" y="273" class="body">Only then start Security.</text><rect x="895" y="145" width="265" height="156" rx="12" class="card"/><text x="913" y="180" class="label">Security adapter</text><text x="913" y="217" class="body">Revalidate the payload.</text><text x="913" y="245" class="body">Scan local training markers.</text><text x="913" y="273" class="body">Return a typed audit.</text><path d="M305 223H325" class="arrow"/><path d="M590 223H610" class="arrow"/><path d="M875 223H895" class="arrow"/><rect x="40" y="355" width="550" height="160" rx="12" class="gate"/><text x="58" y="390" class="label">Separate Crew configurations · EDIT</text><text x="58" y="427" class="body">Inspect tools: the Manager approves; the scanner scans.</text><text x="58" y="455" class="body">Remove the scanner tool from security_manager.</text><text x="58" y="483" class="body">These configurations do not call kickoff().</text><rect x="610" y="355" width="550" height="160" rx="12" class="ok"/><text x="628" y="390" class="label">Inspect and submit</text><text x="628" y="427" class="body">Read event order, handoff, findings, and tool lists.</text><text x="628" y="455" class="body">Three repairs → implementation score /20.</text><text x="628" y="483" class="body">ADR /20: explain evidence and remaining uncertainty.</text></svg>
